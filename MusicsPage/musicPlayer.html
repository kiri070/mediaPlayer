<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>音楽プレイヤー</title>
        <link rel="stylesheet" href="../style.css?v=0.03">
        <link rel="stylesheet" href="help.css?v=0.03">
    </head>
<body>
    <div class="div_gp">

        <nav id="top_menu">
            <a href="../index.html" target="_blank">動画プレイヤーはこちら</a>
            <a href="https://ytmp3.gl/" target="_blank">youtubeの動画をmp3保存するにはこちら</a>
        </nav>
        <nav id="help_menu">
            <span style="font-size: 30px;">ヘルプ</span><br>
            <span id="notPlayList">プレイリストがない？</span><br>
            <span id="deleteHelp">曲を削除するには？</span><br>
            <span id="addHelp">曲を追加できない？</span><br>
        </nav>

        

        <!-- <div>
            <h1>音楽プレイヤー</h1>

            <h3>1曲再生の場合</h3>

            <input type="file" id="musicFile" accept="audio/*,.mp3">
        </div> -->

        <hr>

        <div>
            <span id="musicName"></span><br>
            <audio id="audio" controls playsinline></audio>
            
            <div id="function_drawArea">
                <fieldset id="function_set">
                    <div>
                        <span>繰り返し</span><br>
                        <img src="../Images/loopOff.png" class="buttonIcon" id="loopButton">
                    </div>
                    <div>
                        <span>リピート</span><br>
                        <img src="../Images/loop.png" class="buttonIcon_repeat" id="repeatButton">
                    </div>
                    <div>
                        <img src="../Images/back.png" class="buttonIcon" id="backButton">
                    </div>
                    <div>
                        <img src="../Images/play.png" class="buttonIcon" id="playButton">
                    </div>
                    <div>
                        <img src="../Images/next.png" class="buttonIcon" id="nextButton">
                    </div>
                    <div>
                        <img src="../Images/volumeOn.png" class="buttonIcon" id="volumeButton">
                    </div>
                    
                </fieldset>

                <div id="waveArea">
                    <canvas id="waveform" width="800" height="50"></canvas>
                </div>
            </div>
            
        </div>

        <hr>

        <div>
            <h3>プレイリストに追加</h3>
            <input type="file" id="addPlayList" accept="audio/*,.mp3" multiple><br>

            <fieldset id="playList_fieldset">
                <legend>プレイリスト<span>&emsp;</span><span id="listCount"></span></legend>
                <div id="musicPlayList"></div>
            </fieldset>
        </div>
        
    </div>

    <div id="musicMenu">
        <button id="deleteMusicButton">削除</button>
    </div>
    <div id="wherePlayList">
        <span>正しく読み込まれていない可能性があるため、ページを更新してください。</span>
    </div>
    <div id="delete_help">
        <span>プレイリストの削除したい曲を 長押し または 右クリックで削除オプションが表示されます。</span>
    </div>
    <div id="add_helpText">
        <span>ファイル形式は .mp3 形式のみに対応しています。ファイル形式を確認の上、再度お試しください。</span>
    </div>

    <script src="musicDB.js?v=0.02"></script>
    <script src="musicPlayer.js?v=0.03"></script>
    <script src="musicFunction.js?v=0.03"></script>
    <script>
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (!isMobile)
        {
            const script = document.createElement("script");
            script.src = "audioWave.js?v=0.02";
            document.body.appendChild(script);
        }
        else
        {
            document.getElementById("waveArea").style.display = "none";
        }
    </script>
    <script src="help.js?v=0.03"></script>
</body>
</html>
