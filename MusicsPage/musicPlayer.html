<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>音楽プレイヤー</title>
        <link rel="stylesheet" href="../style.css?v=0.01">
    </head>
<body>
    <div class="div_gp">

        <nav id="top_menu">
            <a href="../index.html" target="_blank">動画プレイヤーはこちら</a>
            <a href="https://ytmp3.gl/" target="_blank">youtubeの動画をmp3保存するにはこちら</a>
        </nav>

        <div>
            <h1>音楽プレイヤー</h1>

            <h3>1曲再生の場合</h3>

            <input type="file" id="musicFile" accept="audio/*">
        </div>

        <hr>

        <div>
            <span id="musicName"></span><br>
            <audio id="audio" controls playsinline></audio>

            <fieldset id="function_set">
                <div>
                    <span>繰り返し</span><br>
                    <img src="../Images/loopOff.png" class="buttonIcon" id="loopButton">
                </div>
                <div>
                    <span>リピート</span><br>
                    <img src="../Images/loop.png" class="buttonIcon_repeat" id="repeatButton">
                </div>
                <div>
                    <img src="../Images/back.png" class="buttonIcon" id="backButton">
                </div>
                <div>
                    <img src="../Images/play.png" class="buttonIcon" id="playButton">
                </div>
                <div>
                    <img src="../Images/next.png" class="buttonIcon" id="nextButton">
                </div>
                <div>
                    <img src="../Images/volumeOn.png" class="buttonIcon" id="volumeButton">
                </div>
                
            </fieldset>
            
        </div>

        <hr>

        <div>
            <h3>プレイリストに追加</h3>
            <input type="file" id="addPlayList" accept="audio/*" multiple><br>

            <fieldset id="playList_fieldset">
                <legend>プレイリスト</legend>
                <div id="musicPlayList"></div>
            </fieldset>
        </div>
        
    </div>
    

    <script src="musicPlayer.js?v=0.01"></script>
    <script src="musicFunction.js?v=0.01"></script>
</body>
</html>
